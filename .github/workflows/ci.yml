name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install fastapi uvicorn httpx pytest ruff numpy psutil onnx onnxruntime onnxscript
      - run: ruff check streamerframes tests tools --select E9,F
      - run: pytest -q
